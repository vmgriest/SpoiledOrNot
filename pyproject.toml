[project]
name = "fruit-ml"
version = "0.1.0"
description = "Fruit freshness classification baseline (PyTorch)"
readme = "METRICS_WALKTHROUGH.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "kagglehub",
    "scikit-learn>=1.2",
    "matplotlib",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.uv]
dev-dependencies = []
